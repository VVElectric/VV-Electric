body.vv-manager-preview-open #vv-manager-preview #vv-manager-quote{width:min(100%,960px)!important;max-width:960px!important;margin:0 auto!important;box-sizing:border-box!important}
body.vv-manager-preview-open{overflow:hidden!important}
body.vv-manager-preview-open #vv-manager-preview .vv-manager-print-body{overflow-x:auto}
@media(max-width:600px){body.vv-manager-preview-open #vv-manager-preview{padding:12px 8px 30px!important}body.vv-manager-preview-open #vv-manager-preview #vv-manager-quote{padding:14px!important}}
@media print{body.vv-manager-preview-open #vv-manager-preview{display:none!important}body.vv-manager-preview-open{overflow:visible!important}}
</style>
<style>
body.vv-manager-preview-open #vv-manager-preview{background:rgba(0,0,0,.86)!important;backdrop-filter:blur(3px)}
body.vv-manager-preview-open #vv-manager-quote{background:#191919!important;color:#f4f4f4!important;border:1px solid #505050!important;border-radius:22px!important;box-shadow:0 24px 90px #000b!important}
body.vv-manager-preview-open #vv-manager-quote .toolbar{position:sticky;top:0;z-index:4;background:#191919;padding:12px 0;border-bottom:1px solid #444}
body.vv-manager-preview-open #vv-manager-quote .quote-letterhead{border-bottom:3px solid #bd942b}
body.vv-manager-preview-open #vv-manager-quote .vv-manager-print-body{max-width:100%;overflow-x:auto}
@media print{body.vv-manager-preview-open #vv-manager-quote{background:white!important;color:black!important;border:0!important;box-shadow:none!important}}

// Forecast only: profit from a quote regardless of payment/conduct status.
// Does not alter received funds, earned profit or accounting balances.
function vvQuoteProjectedProfit(q){
 let revenue=0,cost=0;
 for(const item of q.items||[]){
  const qty=Number(item.qty)||0,price=Number(item.price)||0;
  revenue+=qty*price;
  if(item.type==='Товар')cost+=qty*(Number(item.cost)||0);
 }
 return revenue-cost;
}
function vvEarningsRows(){
 return (db.quotes||[]).filter(q=>Number(q.deposit)>0).map(q=>{
  let sales=0,cost=0,works=0;
  for(const x of q.items||[]){
   const qty=Number(x.qty)||0,price=Number(x.price)||0;
   if(x.type==='Товар'){sales+=qty*price;cost+=qty*(Number(x.cost)||0)}
   else works+=qty*price;
  }
  const total=sales+works,received=Math.min(total,Math.max(0,Number(q.deposit)||0));return {q,sales,cost,works,received,profit:total>0?(sales-cost+works)*received/total:0};
 });
}

}

function ensureBatches(){db.batches??=[];db.nextBatch??=Math.max(0,...db.batches.map(x=>x.id||0))+1;for(let p of db.products){let sum=db.batches.filter(b=>b.productId===p.id).reduce((s,b)=>s+b.qty,0);if(p.stock!==0&&sum===0){db.batches.push({id:db.nextBatch++,productId:p.id,qty:p.stock,cost:p.cost,currency:p.currency,rate:db.rate,date:stamp(),note:'Перенесений залишок'})}}syncStocks()}
function syncStocks(){for(let p of db.products)p.stock=Math.round(db.batches.filter(b=>b.productId===p.id).reduce((s,b)=>s+b.qty,0)*100000)/100000}
function batchUAH(b){return b.cost*(b.currency==='USD'?b.rate:1)}
// FIFO issue: any uncovered quantity becomes an explicit negative debt batch.
function issueStock(p,qty,note){let remaining=qty;for(let b of db.batches.filter(b=>b.productId===p.id&&b.qty>0).sort((a,b)=>a.id-b.id)){let take=Math.min(remaining,b.qty);b.qty=Math.round((b.qty-take)*100000)/100000;remaining=Math.round((remaining-take)*100000)/100000;if(remaining<=0)break}if(remaining>0)db.batches.push({id:db.nextBatch++,productId:p.id,qty:-remaining,cost:0,currency:'UAH',rate:db.rate,date:stamp(),note:'Від’ємний залишок: '+note})}
// New receipts first settle the deficit, then create a priced batch for the balance.
function receiveStock(p,qty,cost,currency,note){let remaining=qty;for(let b of db.batches.filter(b=>b.productId===p.id&&b.qty<0).sort((a,b)=>a.id-b.id)){let settle=Math.min(remaining,-b.qty);b.qty=Math.round((b.qty+settle)*100000)/100000;remaining=Math.round((remaining-settle)*100000)/100000;if(remaining<=0)break}if(remaining>0)db.batches.push({id:db.nextBatch++,productId:p.id,qty:remaining,cost,currency,rate:db.rate,date:stamp(),note});p.cost=cost;p.currency=currency}

function quotes(){return `<div class="panel"><div class="toolbar"><h2>Комерційні пропозиції</h2><button class="primary" onclick="newQuote()">+ Нова КП</button></div><div class="field" style="margin:12px 0"><label for="quoteSearch">Пошук КП за номером, клієнтом або адресою</label><input id="quoteSearch" type="search" placeholder="" oninput="filterQuoteRows()"></div><div class="tablewrap"><table><thead><tr><th>№</th><th>Дата</th><th>Клієнт</th><th>Автор</th><th>Сума</th><th>Завдаток</th><th>Залишок до оплати</th><th>Заробіток по КП <small style="display:block;font-weight:400;opacity:.7">плановий</small></th><th>Статус</th><th>Дії</th></tr></thead><tbody id="quoteRows">${db.quotes.map(q=>`<tr data-quote-id="${q.id}"><td>${quoteNumber(q.id)}</td><td>${esc(q.date)}</td><td>${esc(q.client)}</td><td>${esc(q.createdByName||'admin')}</td><td>${money(q.items.reduce((s,x)=>s+x.price*x.qty,0))}</td><td>${money(Number(q.deposit)||0)}</td><td>${money(Math.max(0,q.items.reduce((s,x)=>s+x.price*x.qty,0)-(Number(q.deposit)||0)))}</td><td><strong>${money(vvQuoteProjectedProfit(q))}</strong></td><td><span class="pill ${quoteIsPaid(q)?'paid-status':''}">${quoteIsPaid(q)?'Оплачено':esc(q.status)}</span></td><td><button onclick="viewQuote(${q.id})">Відкрити</button> ${q.status==='Чернетка'?`<button onclick="editExistingQuote(${q.id})">Редагувати</button> <button onclick="conduct(${q.id})">Провести</button> <button onclick="deleteQuote(${q.id})">Видалити</button>`:`<button onclick="changeQuoteDeposit(${q.id})">Завдаток</button> <button class="primary" onclick="payQuote(${q.id})" ${quoteIsPaid(q)?'disabled':''}>Оплата</button> <button class="danger" onclick="deleteQuote(${q.id})">Видалити КП</button>`}</td></tr>`).join('')}<tr id="quoteEmpty" ${db.quotes.length?'hidden':''}><td colspan="10" class="muted">КП не знайдено</td></tr></tbody></table></div></div><div id="quoteeditor"></div>`}
function cancelQuoteEditor(){const el=document.getElementById('quoteeditor');if(el)el.replaceChildren();document.body.classList.remove('printing-quote');editQuote=null;quoteItems=[]}
function newQuote(){editQuote=null;quoteItems=[];quoteEditor()}function quoteEditor(){document.getElementById('quoteeditor').innerHTML=`<div class="quote-editor-overlay" onclick="if(event.target===this)cancelQuoteEditor()"><div class="quote-editor-dialog" onkeydown="if(event.key==='Enter' && event.target && event.target.tagName==='INPUT'){event.preventDefault();event.stopPropagation();event.target.blur();}" role="dialog" aria-modal="true" aria-label="Редактор комерційної пропозиції"><div class="panel"><div class="quote-editor-head"><h2>${editQuote!==null?"Редагування КП":"Нова комерційна пропозиція"}</h2><button type="button" onclick="cancelQuoteEditor()" aria-label="Закрити редактор">✕</button></div><p class="note">№ ${quoteNumber(editQuote!==null?editQuote:nextQuoteNumber())} · Дата: ${editQuote!==null?esc(db.quotes.find(q=>q.id===editQuote)?.date||quoteDate()):quoteDate()}</p><div class="grid"><div class="field"><label>Клієнт / об'єкт</label><input id="client" placeholder="Ім'я або назва об'єкта" value="${editQuote!==null?esc(db.quotes.find(q=>q.id===editQuote)?.client||''):''}"></div><div class="field"><label>Адреса об’єкта (не друкується)</label><input id="quoteAddress" placeholder="Вулиця, будинок, населений пункт" value="${editQuote!==null?esc(db.quotes.find(q=>q.id===editQuote)?.address||''): ''}"></div><div class="field"><label>Додати позицію</label><select id="pickproduct">${['Матеріали','Роботи','Доставка'].map(group=>`<optgroup label="${group}">${db.products.filter(p=>section(p)===group).sort(alpha).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</optgroup>`).join('')}</select></div><div class="field"><label>Кількість</label><input id="pickqty" type="number" value="1" min="0.001" step="any"></div><div class="field"><label>Завдаток від клієнта, грн</label><input id="quoteDeposit" type="number" min="0" step="0.01" onkeydown="if(event.key==='Enter'){event.preventDefault();event.stopPropagation();this.blur();return false;}" value="${editQuote!==null?Number(db.quotes.find(q=>q.id===editQuote)?.deposit)||0:0}" oninput="renderQuoteLines()"></div></div><p class="actions"><button onclick="addQuoteItem()">+ Додати до КП</button><button class="primary" onclick="openQuotePicker()">☷ Вибрати декілька товарів / робіт</button></p><div id="quotelines"></div><div class="actions"><button class="primary" onclick="saveQuote()">${editQuote!==null?"Зберегти зміни":"Зберегти КП"}</button><button onclick="cancelQuoteEditor()">Скасувати</button></div></div></div></div>`;renderQuoteLines()}
function addQuoteItem(){let p=get(document.getElementById('pickproduct').value),qty=+document.getElementById('pickqty').value;if(!Number.isFinite(qty)||qty<=0)return vvAlert('Некоректна кількість');quoteItems.push({productId:p.id,name:p.name,qty,unit:p.unit,price:sell(p),cost:base(p),type:section(p)==='Доставка'?'Доставка':p.type});renderQuoteLines()}
function openQuotePicker(){pickerSelected={};document.getElementById('modalroot').innerHTML=`<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="modal" style="width:min(880px,100%)"><h2>Вибір товарів та робіт</h2><div class="field"><label>Пошук за назвою</label><input type="text" id="pickerSearch" placeholder="Почни вводити назву…" oninput="renderQuotePicker()" autocomplete="off"></div><div id="pickerList" class="picker-list"></div><div class="toolbar"><strong id="pickerTotal">Вибрано: 0</strong><div class="actions"><button onclick="closeModal()">Скасувати</button><button class="primary" onclick="commitQuotePicker()">Зберегти вибрані</button></div></div></div></div>`;renderQuotePicker();document.getElementById('pickerSearch').focus()}
function renderQuotePicker(){let q=(document.getElementById('pickerSearch')?.value||'').toLocaleLowerCase('uk-UA').trim();let html='';for(let group of ['Матеріали','Роботи','Доставка']){let products=db.products.filter(p=>section(p)===group&&p.name.toLocaleLowerCase('uk-UA').includes(q)).sort(alpha);if(!products.length)continue;html+=`<div class="grouphead" style="padding:10px 12px">${group}</div>`;html+=products.map(p=>`<div class="picker-row"><span>${esc(p.name)} <small>· ${money(sell(p))} / ${esc(p.unit)}</small></span><div class="picker-controls"><button class="tiny" onclick="changePickerQty(${p.id},-1)">−</button><input class="picker-qty-input" type="number" min="0" step="any" aria-label="Кількість ${esc(p.name)}" value="${pickerSelected[p.id]||0}" oninput="setPickerQty(${p.id},this.value)" id="pc${p.id}"><button class="primary tiny" title="Додати" onclick="changePickerQty(${p.id},1)">+</button></div></div>`).join('')}document.getElementById('pickerList').innerHTML=html||'<p class="note" style="padding:12px">Нічого не знайдено</p>';updatePickerTotal()}
function updatePickerTotal(){let el=document.getElementById('pickerTotal');if(el)el.textContent='Вибрано: '+Object.values(pickerSelected).reduce((s,n)=>s+n,0)+' од.'}
function changePickerQty(id,delta){pickerSelected[id]=Math.max(0,(pickerSelected[id]||0)+delta);let el=document.getElementById('pc'+id);if(el)el.value=pickerSelected[id];updatePickerTotal()}
function setPickerQty(id,value){let qty=Number(value);if(!Number.isFinite(qty)||qty<0)return;pickerSelected[id]=qty;updatePickerTotal()}
function commitQuotePicker(){for(let [id,qty] of Object.entries(pickerSelected)){if(!qty)continue;let p=get(id);if(!p)continue;let existing=quoteItems.find(x=>x.productId===p.id);if(existing)existing.qty+=qty;else quoteItems.push({productId:p.id,name:p.name,qty,unit:p.unit,price:sell(p),cost:base(p),type:section(p)==='Доставка'?'Доставка':p.type})}closeModal();renderQuoteLines()}
function setQuoteQty(idx,value){let qty=Number(value);if(!Number.isFinite(qty)||qty<=0){vvAlert('Введи кількість більше нуля');renderQuoteLines();return}quoteItems[idx].qty=qty;renderQuoteLines()}
function groupedRows(items,editable=false){return ['Матеріали','Роботи','Доставка'].map(group=>{let rows=items.map((x,i)=>({...x,idx:i})).filter(x=>section(x)===group).sort(alpha);if(!rows.length)return '';return `<tr class="grouphead"><td colspan="5">${group}</td></tr>`+rows.map(x=>`<tr><td class="name">${esc(x.name)}</td><td>${editable?`<input aria-label="Кількість: ${esc(x.name)}" type="number" min="0.001" step="any" style="width:95px" value="${x.qty}" onchange="setQuoteQty(${x.idx},this.value)"> ${esc(x.unit)}`:`${x.qty} ${esc(x.unit)}`}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td><td>${editable?`<button onclick="quoteItems.splice(${x.idx},1);renderQuoteLines()">×</button>`:''}</td></tr>`).join('')+`<tr class="subtotal"><td colspan="3">Разом: ${group}</td><td>${money(rows.reduce((s,x)=>s+x.qty*x.price,0))}</td><td></td></tr>`}).join('')}
function renderQuoteLines(){let el=document.getElementById('quotelines');if(!el)return;el.innerHTML=`<div class="tablewrap"><table><tr><th>Позиція</th><th>К-сть</th><th>Ціна</th><th>Сума</th><th></th></tr>${groupedRows(quoteItems,true)}</table></div><p class="right"><strong>Разом: ${money(quoteItems.reduce((s,x)=>s+x.price*x.qty,0))}</strong></p><p class="right">Завдаток: ${money(Number(document.getElementById("quoteDeposit")?.value)||0)} · До оплати: <strong>${money(Math.max(0,quoteItems.reduce((s,x)=>s+x.price*x.qty,0)-(Number(document.getElementById("quoteDeposit")?.value)||0)))}</strong></p>`}
function saveQuote(){if(!quoteItems.length)return vvAlert('Додай товари або роботи');let client=document.getElementById('client').value.trim()||'Без назви',address=document.getElementById('quoteAddress').value.trim(),deposit=Number(document.getElementById('quoteDeposit').value),total=quoteItems.reduce((s,x)=>s+x.price*x.qty,0);if(!Number.isFinite(deposit)||deposit<0||deposit>total)return vvAlert('Завдаток має бути від 0 до загальної суми КП');let items=JSON.parse(JSON.stringify(quoteItems));if(editQuote!==null){let q=db.quotes.find(q=>q.id===editQuote);if(!q||q.status!=='Чернетка')return vvAlert('Можна редагувати тільки чернетки');q.client=client;q.address=address;q.deposit=deposit;q.items=items}else{db.quotes.unshift({id:nextQuoteNumber(),client,address,date:quoteDate(),status:'Чернетка',deposit,items});db.nextQuote=nextQuoteNumber()}editQuote=null;quoteItems=[];const editor=document.getElementById('quoteeditor');if(editor)editor.replaceChildren();document.body.classList.remove('printing-quote');save();render();}
function editExistingQuote(id){let q=db.quotes.find(q=>q.id===id);if(!q||q.status!=='Чернетка')return vvAlert('Проведену КП не можна змінювати, бо товар уже списаний');editQuote=id;quoteItems=JSON.parse(JSON.stringify(q.items));quoteEditor()}
function quoteIsPaid(q){return q.status!=='Чернетка' && q.items.reduce((sum,x)=>sum+x.price*x.qty,0)-(Number(q.deposit)||0)<0.005}
async function payQuote(id){let q=db.quotes.find(x=>x.id===id);if(!q||q.status==='Чернетка')return vvAlert('Спочатку проведи КП');if(quoteIsPaid(q))return;let total=q.items.reduce((sum,x)=>sum+x.price*x.qty,0);let due=Math.max(0,total-(Number(q.deposit)||0));if(!await vvConfirm('Отримано залишок оплати '+money(due)+' за КП '+quoteNumber(id)+'?'))return;q.deposit=total;q.paidAt=stamp();save();render()}
async function deleteQuote(id){let q=db.quotes.find(x=>x.id===id);if(!q)return;let conducted=q.status!=='Чернетка';let msg=conducted?'Видалити проведену КП '+quoteNumber(id)+'? Усі її матеріали повернуться на склад. Цю дію не можна скасувати.':'Видалити КП '+quoteNumber(id)+'? Цю дію не можна скасувати.';if(!await vvConfirm(msg))return;
if(conducted){let returns={};for(let x of q.items){if(x.type==='Товар')returns[x.productId]=(returns[x.productId]||0)+Number(x.qty)}for(let [productId,qty] of Object.entries(returns)){let p=get(productId);if(!p){vvAlert('Не вдалося повернути товар ID '+productId+'. КП не видалено.');return}}for(let [productId,qty] of Object.entries(returns)){let p=get(productId);receiveStock(p,qty,p.cost,p.currency,'Повернення після видалення КП '+quoteNumber(id));db.moves.unshift({date:stamp(),name:p.name,delta:qty,note:'Повернення після видалення КП '+quoteNumber(id)})}syncStocks()}
db.quotes=db.quotes.filter(x=>x.id!==id);db.nextQuote=nextQuoteNumber();save();render()}
async function changeQuoteDeposit(id){let q=db.quotes.find(q=>q.id===id);if(!q)return;let total=q.items.reduce((s,x)=>s+x.price*x.qty,0);let raw=await vvPrompt('Завдаток від клієнта у гривнях (0–'+total.toFixed(2)+'):',String(Number(q.deposit)||0));if(raw===null)return;let amount=Number(raw.replace(',','.'));if(!Number.isFinite(amount)||amount<0||amount>total)return vvAlert('Невірна сума завдатку');q.deposit=amount;save();render();viewQuote(id)}
async function conduct(id){let q=db.quotes.find(q=>q.id===id);if(!q||q.status!=='Чернетка')return;let need={};for(let x of q.items)if(x.type==='Товар')need[x.productId]=(need[x.productId]||0)+x.qty;for(let [id,qty] of Object.entries(need)){if(!get(id))return vvAlert('Товар не знайдено: '+id)}if(!await vvConfirm('Провести КП '+quoteNumber(q.id)+' та списати товари зі складу? Якщо товару бракує, залишок стане від’ємним.'))return;for(let [id,qty] of Object.entries(need)){let p=get(id);issueStock(p,qty,'Продаж КП '+quoteNumber(q.id));db.moves.unshift({date:stamp(),name:p.name,delta:-qty,note:'Продаж КП '+quoteNumber(q.id)})}syncStocks();q.status='Проведено';save();render()}

function vvLoadPDFScript(url, globalName){
 if(window[globalName])return Promise.resolve();
 return new Promise((resolve,reject)=>{
  const script=document.createElement('script');script.src=url;script.onload=()=>window[globalName]?resolve():reject(new Error('Бібліотека PDF не завантажилась'));
  script.onerror=()=>reject(new Error('Немає доступу до бібліотеки PDF. Перевір інтернет.'));
  document.head.appendChild(script);
 });
}

// Offline iOS print: no CDN scripts or PDF libraries required.
// VV Electric 72: branded A4 PDF rendered locally, with no remote PDF libraries.
let vvPdfBusy=false;
async function vvSaveQuotePDF(source,filename){
 if(vvPdfBusy)return;
 if(!source)return alert('Не знайдено комерційну пропозицію.');
 vvPdfBusy=true;
 try{
  const W=1240,H=1754,M=76,contentW=W-2*M;
  const pages=[];let canvas,ctx,y;
  const ink='#222222',gold='#b88a20',muted='#626262';
  function newPage(){
   canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
   ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
   y=M;
  }
  function savePage(){if(canvas)pages.push(canvas.toDataURL('image/jpeg',0.91).split(',')[1]);}
  function ensure(h){if(y+h>H-M){savePage();newPage();}}
  function font(size=22,bold=false){ctx.font=(bold?'700 ':'400 ')+size+'px -apple-system, BlinkMacSystemFont, Arial, sans-serif';}
  function wrap(t,max,size=22,bold=false){
   font(size,bold);const words=String(t||'').replace(/\s+/g,' ').trim().split(' ');
   let lines=[],line='';
   for(const word of words){
    const next=line?line+' '+word:word;
    if(ctx.measureText(next).width>max&&line){lines.push(line);line=word}else line=next;
    while(ctx.measureText(line).width>max&&line.length>1){
     let n=line.length-1;while(n>1&&ctx.measureText(line.slice(0,n)).width>max)n--;
     lines.push(line.slice(0,n));line=line.slice(n);
    }
   }
   if(line)lines.push(line);
   return lines.length?lines:[''];
  }
  function txt(t,x,top,size=22,bold=false,color=ink,align='left'){
   ctx.fillStyle=color;font(size,bold);ctx.textAlign=align;ctx.textBaseline='top';
   ctx.fillText(String(t||''),x,top);
  }
  function horizontal(top,color='#dedede',thickness=1){
   ctx.fillStyle=color;ctx.fillRect(M,top,contentW,thickness);
  }
  function textBlock(t,size=22,bold=false,color=ink,after=10){
   const lines=wrap(t,contentW,size,bold),lh=size*1.4;
   ensure(lines.length*lh+after);
   for(const ln of lines){txt(ln,M,y,size,bold,color);y+=lh;}
   y+=after;
  }
  newPage();
  // Reuse the quotation's actual brand logo.
  const logo=source.querySelector('.quote-letterhead img');
  if(logo){
   try{
    const img=new Image();img.src=logo.src;
    await new Promise(resolve=>{if(img.complete){resolve();return;}img.onload=resolve;img.onerror=resolve;setTimeout(resolve,1000);});
    if(img.naturalWidth)ctx.drawImage(img,M,y,83,83);
   }catch(_){}
  }
  txt('VV',M+100,y+12,42,true,ink);
  txt('Electric',M+160,y+12,42,true,gold);
  y+=110;horizontal(y,gold,4);y+=32;
  const title=source.querySelector('h2');
  textBlock(title?.innerText||'Комерційна пропозиція',32,true,ink,10);
  const subtitle=Array.from(source.querySelectorAll('p')).find(el=>/Клієнт:/.test(el.innerText));
  if(subtitle)textBlock(subtitle.innerText,21,false,muted,25);
  const table=source.querySelector('table');
  if(!table)throw new Error('Не знайдено таблицю комерційної пропозиції.');
  // Match the original quote: name, quantity, unit price, amount in four columns.
  const cols=[M,M+575,M+735,M+914,W-M];
  function row(cells,kind){
   const isHead=kind==='head',isGroup=kind==='group',isSubtotal=kind==='subtotal';
   const size=isHead?20:21,weight=isHead||isGroup||isSubtotal;
   const vals=cells.map(c=>String(c?.innerText||'').replace(/\s+/g,' ').trim());
   const lines=vals.map((v,i)=>wrap(v,cols[i+1]-cols[i]-18,size,weight));
   const height=Math.max(...lines.map(l=>l.length))*29+22;
   ensure(height);
   const top=y;
   if(isHead||isGroup||isSubtotal){
    ctx.fillStyle=isHead?'#363636':isGroup?'#e7e7e7':'#f4f4f4';
    ctx.fillRect(M,top,contentW,height);
   }
   for(let i=0;i<Math.min(4,vals.length);i++){
    const right=i>0;
    const x=right?cols[i+1]-12:cols[i]+12;
    for(let k=0;k<lines[i].length;k++){
     txt(lines[i][k],x,top+12+k*29,size,weight,isHead?'#ffffff':ink,right?'right':'left');
    }
   }
   y+=height;horizontal(y,'#d7d7d7');y+=1;
  }
  const heads=table.querySelectorAll('thead tr');
  for(const tr of heads)row(Array.from(tr.children),'head');
  for(const tr of table.querySelectorAll('tbody tr')){
   const c=Array.from(tr.children);
   const kind=tr.classList.contains('grouphead')?'group':tr.classList.contains('subtotal')?'subtotal':'normal';
   row(c,kind);
  }
  y+=28;
  // The quotation uses h2.right for the grand total and amount due,
  // and p.right for the deposit. Read all three in their original DOM order.
  let summary=Array.from(source.querySelectorAll('h2.right, p.right'));
  // Manager quotation markup may use different classes: find its total nodes by label.
  if(!summary.length){
   summary=Array.from(source.querySelectorAll('h2,p,strong')).filter(el=>
    /^(Разом:|Загальна сума:|Завдаток:|До оплати:)/i.test((el.innerText||'').trim()) &&
    !el.querySelector('h2,p,strong'));
  }
  const texts=summary.map(el=>(el.innerText||'').replace(/\s+/g,' ').trim());
  // Never silently export a quote without its monetary totals.
  if(!texts.some(t=>/^(Разом:|Загальна сума:)/i.test(t)) ||
     !texts.some(t=>/^До оплати:/i.test(t))){
   const values=Array.from(table.querySelectorAll('tbody tr')).filter(tr=>
    !tr.classList.contains('grouphead') && !tr.classList.contains('subtotal'));
   const qTotal=values.reduce((sum,tr)=>{
    const cell=tr.lastElementChild;
    const val=Number((cell?.innerText||'').replace(/[^0-9,.-]/g,'').replace(/\s/g,'').replace(',','.'));
    return sum+(Number.isFinite(val)?val:0);
   },0);
   const depositNode=summary.find(el=>/^Завдаток:/i.test((el.innerText||'').trim()));
   const deposit=Number((depositNode?.innerText||'0').replace(/[^0-9,.-]/g,'').replace(',','.'))||0;
   const fmt=n=>n.toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₴';
   if(!texts.some(t=>/^(Разом:|Загальна сума:)/i.test(t)))texts.unshift('Загальна сума: '+fmt(qTotal));
   if(!texts.some(t=>/^Завдаток:/i.test(t)))texts.push('Завдаток: '+fmt(deposit));
   if(!texts.some(t=>/^До оплати:/i.test(t)))texts.push('До оплати: '+fmt(Math.max(0,qTotal-deposit)));
  }
  for(const t of texts){
   const important=/^(Разом:|Загальна сума:|До оплати:)/i.test(t);
   textBlock(t,important?27:22,important,important?ink:muted,16);
  }
  savePage();
  if(!pages.length)throw Error('Немає сторінок для PDF');
  const enc=new TextEncoder(),parts=[],offsets=[0];let position=0;
  function add(x){let bytes=typeof x==='string'?enc.encode(x):x;parts.push(bytes);position+=bytes.length;}
  function obj(id,content){offsets[id]=position;add(id+' 0 obj\n');add(content);add('\nendobj\n');}
  add('%PDF-1.4\n');
  const count=pages.length, pageRefs=pages.map((_,i)=>3+i*3);
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+pageRefs.map(x=>x+' 0 R').join(' ')+'] /Count '+count+' >>');
  for(let i=0;i<count;i++){
   const pageId=3+i*3,imgId=pageId+1,contentId=pageId+2;
   obj(pageId,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 '+imgId+' 0 R >> >> /Contents '+contentId+' 0 R >>');
   const bin=atob(pages[i]),raw=new Uint8Array(bin.length);
   for(let j=0;j<bin.length;j++)raw[j]=bin.charCodeAt(j);
   offsets[imgId]=position;add(imgId+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+W+' /Height '+H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+raw.length+' >>\nstream\n');add(raw);add('\nendstream\nendobj\n');
   const cmd='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q\n';
   obj(contentId,'<< /Length '+enc.encode(cmd).length+' >>\nstream\n'+cmd+'endstream');
  }
  const start=position;const total=2+3*count;
  add('xref\n0 '+(total+1)+'\n0000000000 65535 f \n');
  for(let i=1;i<=total;i++)add(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
  add('trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+start+'\n%%EOF');
  const blob=new Blob(parts,{type:'application/pdf'});
  const file=new File([blob],filename||'VV_Electric_KP.pdf',{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
   try{await navigator.share({files:[file],title:'Комерційна пропозиція VV Electric'});return;}
   catch(e){if(e.name==='AbortError')return;}
  }
  const url=URL.createObjectURL(blob),anchor=document.createElement('a');
  anchor.href=url;anchor.download=file.name;document.body.appendChild(anchor);anchor.click();anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
 }catch(e){console.error('VV Electric PDF',e);alert('Не вдалося створити PDF: '+(e.message||e));}
 finally{vvPdfBusy=false;}
}
function vvIsIOSDevice(){

   (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

   try{
     await win.document.fonts.ready;
     await Promise.all(Array.from(win.document.images).map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;setTimeout(resolve,1500)})));
   }catch(_){}

function clearMovementHistory(){if(!db.moves.length)return alert('Історія вже порожня');if(!confirm('Очистити всю історію руху товарів?\n\nЦе видалить '+db.moves.length+' записів. Залишки на складі, партії, ціни та КП не зміняться. Дію неможливо скасувати.'))return;db.moves=[];save();render()}
function history(){return `<div class="panel"><div class="toolbar"><h2>Історія руху товарів</h2><button class="danger" onclick="clearMovementHistory()" ${db.moves.length?"":"disabled"}>Очистити історію</button></div><p class="note">Очищення видаляє тільки журнал операцій. Залишки, партії, ціни та КП залишаться без змін. Перед очищенням рекомендуємо зберегти резервну копію в налаштуваннях.</p><div class="tablewrap"><table><tr><th>Дата</th><th>Товар</th><th>Зміна кількості</th><th>Підстава</th></tr>${db.moves.map(m=>`<tr><td>${esc(m.date)}</td><td class="name">${esc(m.name)}</td><td class="${m.delta>=0?'status':'warn'}">${m.delta>0?'+':''}${m.delta}</td><td>${esc(m.note)}</td></tr>`).join('')}</table></div></div>`}
function settings(){ensureCategories();return `${vvRole==='admin'?vvUsersPanel():''}<div class="panel"><h2>Налаштування</h2><p class="note"><strong>Версія застосунку: VV Electric 72</strong></p><div class="grid"><div class="field"><label>Курс долара USD → UAH</label><input id="rate" type="number" step="0.01" min="0.01" value="${db.rate}"></div></div><p><button class="primary" onclick="setRate()">Зберегти курс</button></p><p class="note">Валюта задається для кожного товару окремо. Закупівельна ціна в USD перераховується за курсом. Старі КП зберігають зафіксовані ціни.</p></div><details class="panel category-accordion" id="category-accordion"><summary class="category-summary"><span>Категорії та націнка</span><span class="category-chevron" aria-hidden="true">⌄</span></summary><div class="category-accordion-body"><p class="note">Відсоток задається для всієї категорії. Зміни впливають на ціни майбутніх КП, але не змінюють уже збережені КП.</p><div class="tablewrap"><table><thead><tr><th>Категорія</th><th>Націнка, %</th><th>Дія</th></tr></thead><tbody>${Object.entries(categoryMarkups()).map(([name,value],i)=>`<tr><td>${esc(name)}</td><td><input type="number" min="0" max="10000" step="any" id="catmarkup${i}" value="${value}" style="max-width:130px"></td><td><button class="tiny" onclick="saveCategoryMarkup(${i})">Зберегти</button></td></tr>`).join('')}</tbody></table></div><div class="actions" style="margin-top:16px"><input id="newcategoryname" placeholder="Нова категорія" maxlength="80"><input id="newcategorymarkup" type="number" min="0" max="10000" step="any" placeholder="Націнка, %" style="max-width:150px"><button class="primary" onclick="addCategoryMarkup()">+ Додати категорію</button></div></div></details><div class="panel"><h2>Резервна копія</h2><p class="note">Дані зберігаються лише в цьому браузері. Регулярно експортуй резервну копію JSON: очищення браузера може видалити всі записи.</p><div class="actions"><button onclick="backup()">Завантажити резервну копію</button><label style="border:1px solid #41516a;border-radius:8px;padding:10px;cursor:pointer">Відновити з JSON <input style="display:none" type="file" accept=".json" onchange="restore(this)"></label></div></div>`}
function applyCategoryMarkups(){for(const p of db.products){if(p.type==='Товар'&&Object.prototype.hasOwnProperty.call(categoryMarkups(),p.category))p.markup=Number(categoryMarkups()[p.category]);}}
function saveCategoryMarkup(i){ensureCategories();const name=Object.keys(categoryMarkups())[i],el=document.getElementById('catmarkup'+i);if(!name||!el)return;const value=Number(el.value);if(!Number.isFinite(value)||value<0||value>10000)return alert('Перевір відсоток');db.categoryMarkups[name]=value;applyCategoryMarkups();save();render();document.getElementById('category-accordion')?.setAttribute('open','');}
function addCategoryMarkup(){ensureCategories();const name=document.getElementById('newcategoryname').value.trim(),value=Number(document.getElementById('newcategorymarkup').value);if(!name||name.length>80)return alert('Введи назву категорії');if(Object.prototype.hasOwnProperty.call(categoryMarkups(),name))return alert('Така категорія вже існує');if(!Number.isFinite(value)||value<0||value>10000)return alert('Перевір відсоток');db.categoryMarkups[name]=value;save();render();document.getElementById('category-accordion')?.setAttribute('open','');}
function setRate(){let r=+document.getElementById('rate').value;if(!Number.isFinite(r)||r<=0)return alert('Невірний курс');db.rate=r;save();render()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='VV-Electric-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restore(el){let file=el.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.products)||!Array.isArray(d.quotes)||!Array.isArray(d.moves))throw Error('format');if(!confirm('Замінити всі поточні дані резервною копією?'))return;db=d;ensureBatches();save();render()}catch(e){alert('Неправильний файл резервної копії')}}

let vvMembers=[];

let vvPresenceChannel=null;
let vvOnlineManagers=new Set();
let vvPresenceStarted=false;
function vvStartPresence(){
 if(vvPresenceStarted||!vvUser||!vvRole)return;
 vvPresenceStarted=true;
 try{
  const channel=vvClient.channel('vv-electric-team-presence-v1',{config:{presence:{key:vvUser.id}}});
  vvPresenceChannel=channel;
  channel.on('presence',{event:'sync'},()=>{
   const state=channel.presenceState();
   const online=new Set();
   Object.entries(state).forEach(([id,items])=>{
    if(items.some(x=>x.role==='manager'))online.add(id);
   });
   vvOnlineManagers=online;
   vvUpdatePresenceLabels();
  });
  channel.subscribe(async status=>{
   if(status==='SUBSCRIBED'){
    try{await channel.track({role:vvRole,username:vvUser.email||'',at:new Date().toISOString()})}catch(e){console.warn('Presence track:',e)}
   }
   if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
    vvOnlineManagers=new Set();vvUpdatePresenceLabels(true);
   }
  });
 }catch(e){vvPresenceStarted=false;console.warn('Presence:',e)}
}
function vvStopPresence(){
 if(vvPresenceChannel){vvClient.removeChannel(vvPresenceChannel).catch(()=>{});vvPresenceChannel=null;}
 vvPresenceStarted=false;vvOnlineManagers=new Set();vvRenderPresenceRoster();
}
function vvUpdatePresenceLabels(unknown=false){
 vvPresenceUnknown=unknown;
 vvRenderPresenceRoster();
}
let vvPresenceUnknown=false;
let vvRosterLoaded=false;
let vvRosterLoading=false;
async function vvRefreshRoster(silent=true){
 if(vvRole!=='admin'||vvRosterLoading)return;
 vvRosterLoading=true;
 try{
  const data=await vvTeam('list');
  vvMembers=data.users||[];
  vvRosterLoaded=true;
  vvRenderPresenceRoster();
  if(document.getElementById('vv-members'))vvRenderMembers();
 }catch(e){
  if(!silent)alert('Не вдалося завантажити менеджерів: '+e.message);
  vvRenderPresenceRoster();
 }finally{vvRosterLoading=false;}
}
function vvToggleRoster(){

 if(!panel)return;
 const opening=panel.hidden;
 panel.hidden=!opening;
 document.getElementById('vv-roster-button')?.setAttribute('aria-expanded',String(opening));

}
function vvRenderPresenceRoster(){
 const btn=document.getElementById('vv-roster-button');
 const panel=document.getElementById('vv-roster-panel');
 if(!btn||!panel)return;
 const isAdmin=vvRole==='admin'&&!document.body.classList.contains('vv-locked');
 btn.hidden=!isAdmin;
 if(!isAdmin){panel.hidden=true;return;}
 const members=vvMembers.filter(m=>m.role==='manager'&&m.active);
 const count=members.filter(m=>vvOnlineManagers.has(String(m.user_id))).length;
 const badge=document.getElementById('vv-roster-count');
 badge.textContent=String(count);
 badge.hidden=!count;
 const total=document.getElementById('vv-roster-total');
 total.textContent=vvRosterLoaded?`Усього менеджерів: ${members.length} · Онлайн: ${count}`:'Завантаження списку менеджерів…';
 const list=document.getElementById('vv-roster-list');
 list.innerHTML=!vvRosterLoaded?'<p>Завантаження…</p>':members.length?members.map(m=>{
  const online=vvOnlineManagers.has(String(m.user_id));
  return `<div class="vv-roster-person"><span class="vv-roster-dot ${online?'is-online':''}"></span><span>${esc(m.username)}</span><span class="vv-roster-status">${vvPresenceUnknown?'Зв’язок втрачено':online?'Онлайн':'Не в мережі'}</span></div>`;
 }).join(''):'<p>Менеджерів поки немає.</p>';
}

async function vvManagerAdjust(productId,sign){
 const product=vvManagerData.products.find(x=>Number(x.id)===Number(productId));if(!product)return;
 const value=prompt((sign>0?'Оприбуткувати':'Списати')+' «'+product.name+'». Кількість:', '1');if(value===null)return;
 const qty=Number(value.replace(',','.'))*sign;
 if(!Number.isFinite(qty)||qty===0||Math.abs(qty)>1000000)return alert('Невірна кількість');
 if(!confirm((sign>0?'Додати ':'Списати ')+Math.abs(qty)+' '+product.unit+'?'))return;
 try{await vvWorkspace('stock_adjust',{productId,qty});await vvManagerRefresh();vvToast('Склад оновлено')}catch(e){alert(e.message)}
}

async function vvManagerEditStock(productId){
 const name=document.getElementById('vv-stock-name-'+productId)?.value.trim();
 const cost=Number(document.getElementById('vv-stock-cost-'+productId)?.value);
 const price=Number(document.getElementById('vv-stock-price-'+productId)?.value);
 if(!name||name.length<2||!Number.isFinite(cost)||cost<0||!Number.isFinite(price)||price<0)return alert('Вкажіть назву, оптову та продажну ціну');
 if(!confirm('Зберегти назву, оптову та продажну ціну товару?'))return;
 try{await vvWorkspace('stock_edit',{productId,name,cost,price});await vvManagerRefresh();vvToast('Дані товару оновлено')}catch(e){alert(e.message)}
}
async function vvManagerReceive(){
 const productId=Number(document.getElementById('vv-receive-product').value),qty=Number(document.getElementById('vv-receive-qty').value);
 if(!Number.isFinite(qty)||qty<=0)return alert('Вкажіть кількість');
 if(!confirm('Оприбуткувати '+qty+' одиниць на спільний склад?'))return;
 try{await vvWorkspace('stock_receive',{productId,qty});await vvManagerRefresh();vvToast('Товар оприбутковано')}catch(e){alert(e.message)}
}
async function vvManagerAction(action,id,extra={}){
 if(!confirm(action==='quote_delete'?'Видалити КП? Для проведеної КП товар повернеться на склад.':action==='quote_conduct'?'Провести КП і списати товари?':'Підтвердити дію?'))return;
 try{await vvWorkspace(action,{id,...extra});await vvManagerRefresh();vvToast('Зміни збережено')}catch(e){alert(e.message)}
}
function vvManagerPay(id){const q=vvManagerData.quotes.find(x=>x.id===id);if(!q)return;const due=q.items.reduce((s,x)=>s+x.qty*x.price,0)-(Number(q.deposit)||0);const value=prompt('Сума оплати, грн. Залишок: '+due.toFixed(2),due.toFixed(2));if(value===null)return;const amount=Number(value);if(!Number.isFinite(amount)||amount<=0||amount>due)return alert('Неправильна сума');vvWorkspace('quote_pay',{id,amount}).then(()=>vvManagerRefresh()).catch(e=>alert(e.message));}
function vvManagerDeposit(id){
 const q=vvManagerData.quotes.find(x=>x.id===id);if(!q)return;
 const total=q.items.reduce((s,x)=>s+Number(x.qty)*Number(x.price),0);
 const value=prompt('Завдаток за КП, грн (загальна отримана сума):',String(Number(q.deposit)||0));
 if(value===null)return;const amount=Number(String(value).replace(',','.'));
 if(!Number.isFinite(amount)||amount<0||amount>total)return alert('Неправильна сума завдатку');
 if(!confirm('Підтвердити завдаток '+amount.toFixed(2)+' грн за КП № '+id+'?'))return;
 vvWorkspace('quote_deposit',{id,amount}).then(()=>vvManagerRefresh()).catch(e=>alert(e.message));
}
let vvManagerPickerQty={};
function vvManagerFilterQuotes(){const term=(document.getElementById('vv-m-quote-search')?.value||'').trim().toLocaleLowerCase('uk-UA');document.querySelectorAll('[data-vv-quote-search]').forEach(row=>row.hidden=!!term&&!row.getAttribute('data-vv-quote-search').includes(term));}
function vvManagerEdit(i){
 const q=i===null?null:vvManagerData.quotes[i];vvManagerEditing=q?.id||null;vvManagerItems=q?JSON.parse(JSON.stringify(q.items)):[];
 const el=document.getElementById('vv-manager-editor');if(!el)return;
 el.innerHTML='<div class="panel" id="vv-m-quote-editor"><div class="toolbar"><h2>'+(q?'Редагувати КП № '+quoteNumber(q.id):'Нова КП')+'</h2><button onclick="vvManagerOpenPicker()" class="primary">+ Вибрати товари / роботи</button></div><div class="field"><label>Клієнт</label><input id="vv-m-client" value="'+vvEscape(q?.client||'')+'" placeholder="Ім’я клієнта"></div><div class="field"><label>Адреса об’єкта (не друкується)</label><input id="vv-m-address" value="'+vvEscape(q?.address||'')+'" placeholder="Вулиця, будинок, населений пункт"></div><div id="vv-m-lines"></div><div class="field"><label>Аванс / завдаток, грн</label><input id="vv-m-deposit" type="number" min="0" step="0.01" value="'+(q?.deposit||0)+'" '+(!vvPermissions.payments?'readonly':'')+'></div><div class="actions"><button class="primary" onclick="vvManagerSave()">Зберегти КП</button><button onclick="document.getElementById(\'vv-manager-editor\').innerHTML=\'\'">Закрити</button></div></div><div id="vv-m-picker-root"></div>';
 vvManagerLines();el.scrollIntoView({behavior:'smooth'});
}
function vvManagerOpenPicker(){
 vvManagerPickerQty={};const el=document.getElementById('vv-m-picker-root');if(!el)return;
 el.innerHTML='<div class="vv-m-picker-backdrop" onclick="if(event.target===this)vvManagerClosePicker()"><div class="vv-m-picker-dialog" role="dialog" aria-modal="true" aria-label="Вибір товарів та робіт"><div class="toolbar"><h2>Вибір товарів та робіт</h2><button onclick="vvManagerClosePicker()" aria-label="Закрити">✕</button></div><div class="field"><label>Пошук за назвою</label><input type="search" id="vv-m-picker-search" placeholder="Почни вводити назву товару" oninput="vvManagerRenderPicker()"></div><div id="vv-m-picker-list"></div><div class="vv-m-picker-footer"><strong id="vv-m-picker-count">Вибрано: 0</strong><button class="primary" onclick="vvManagerCommitPicker()">Додати вибрані позиції</button></div></div></div>';
 vvManagerRenderPicker();document.getElementById('vv-m-picker-search')?.focus();
}
function vvManagerClosePicker(){const el=document.getElementById('vv-m-picker-root');if(el)el.innerHTML='';}
function vvManagerRenderPicker(){
 const el=document.getElementById('vv-m-picker-list');if(!el)return;
 const search=(document.getElementById('vv-m-picker-search')?.value||'').trim().toLocaleLowerCase('uk-UA');
 const products=(vvManagerData.products||[]).filter(p=>p.name.toLocaleLowerCase('uk-UA').includes(search));
 let html='';
 for(const group of ['Товар','Робота','Доставка']){
  const items=products.filter(p=>group==='Доставка'?p.type==='Доставка':p.type===group).sort((a,b)=>a.name.localeCompare(b.name,'uk'));
  if(!items.length)continue;
  html+='<h3 class="vv-m-picker-group">'+(group==='Товар'?'Матеріали':group==='Робота'?'Роботи':'Доставка')+'</h3>';
  for(const p of items){const qty=vvManagerPickerQty[p.id]||0;
   html+='<div class="vv-m-picker-row"><div class="vv-m-picker-description"><strong>'+vvEscape(p.name)+'</strong><small>'+Number(p.price||0).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₴ / '+vvEscape(p.unit||'шт')+(group==='Товар'?' · залишок: '+vvEscape(p.stock):'')+'</small></div><div class="vv-m-picker-controls"><button type="button" onclick="vvManagerPickerStep('+p.id+',-1)">−</button><input aria-label="Кількість: '+vvEscape(p.name)+'" type="number" min="0" step="any" id="vv-m-pick-'+p.id+'" value="'+qty+'" onchange="vvManagerPickerSet('+p.id+',this.value)"><button type="button" onclick="vvManagerPickerStep('+p.id+',1)">+</button></div></div>';
  }
 }
 el.innerHTML=html||'<p class="note">Нічого не знайдено</p>';vvManagerPickerCount();
}
function vvManagerPickerSet(id,value){const qty=Number(String(value).replace(',','.'));if(!Number.isFinite(qty)||qty<0)return alert('Кількість має бути 0 або більше');vvManagerPickerQty[id]=qty;vvManagerPickerCount();}
function vvManagerPickerStep(id,step){const qty=Math.max(0,Math.round(((vvManagerPickerQty[id]||0)+step)*1000)/1000);vvManagerPickerQty[id]=qty;const input=document.getElementById('vv-m-pick-'+id);if(input)input.value=qty;vvManagerPickerCount();}
function vvManagerPickerCount(){const el=document.getElementById('vv-m-picker-count');if(el)el.textContent='Вибрано позицій: '+Object.values(vvManagerPickerQty).filter(x=>x>0).length;}
function vvManagerCommitPicker(){
 for(const [id,value] of Object.entries(vvManagerPickerQty)){
  const qty=Number(value);if(!Number.isFinite(qty)||qty<=0)continue;
  const p=vvManagerData.products.find(x=>Number(x.id)===Number(id));if(!p)continue;
  const existing=vvManagerItems.find(x=>Number(x.productId)===Number(id));
  if(existing)existing.qty=Math.round((Number(existing.qty)+qty)*1000)/1000;
  else vvManagerItems.push({productId:p.id,name:p.name,unit:p.unit,type:p.type,qty,price:Number(p.price)||0});
 }
 vvManagerClosePicker();vvManagerLines();
}
function vvManagerLines(){
 const el=document.getElementById('vv-m-lines');if(!el)return;
 const total=vvManagerItems.reduce((s,x)=>s+Number(x.qty)*Number(x.price),0);
 el.innerHTML=vvManagerItems.length?'<div class="tablewrap"><table><tr><th>Позиція</th><th>Кількість</th><th>Ціна, ₴</th><th>Сума, ₴</th><th></th></tr>'+vvManagerItems.map((x,i)=>'<tr><td>'+vvEscape(x.name)+'</td><td><input style="width:90px" type="number" min="0.001" step="any" value="'+x.qty+'" onchange="vvManagerChangeLine('+i+',\'qty\',this.value)"></td><td><input style="width:110px" type="number" min="0" step="any" value="'+x.price+'" onchange="vvManagerChangeLine('+i+',\'price\',this.value)"></td><td>'+Number(x.qty*x.price).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+'</td><td><button onclick="vvManagerItems.splice('+i+',1);vvManagerLines()">✕</button></td></tr>').join('')+'</table></div>':'<p class="note">Поки немає позицій. Натисни «Вибрати товари / роботи», щоб відкрити список.</p>';
 el.innerHTML+='<p style="text-align:right"><strong>Разом: '+total.toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₴</strong></p>';
}
function vvManagerChangeLine(i,field,value){const v=Number(String(value).replace(',','.'));if(!Number.isFinite(v)||v<(field==='qty'?0.001:0)){alert('Некоректне значення');vvManagerLines();return;}vvManagerItems[i][field]=v;vvManagerLines();}

 const headers={'Content-Type':'application/json','apikey':VV_KEY};
 if(authenticated){const {data}=await vvClient.auth.getSession();if(!data.session)throw Error('Увійдіть у систему');headers.Authorization='Bearer '+data.session.access_token}

async function cloudSave(){
 if(!vvReady||vvBlocked)return;
 vvDirty=true;vvStatus('Збереження…');
 if(vvSaving)return;
 vvSaving=true;
 try{
  while(vvDirty&&!vvBlocked){
   vvDirty=false;const snapshot=JSON.stringify(db);
   if(snapshot===vvLastSerialized)continue;
   let data;try{data=await vvWorkspace('replace',{revision:vvRevision,payload:JSON.parse(snapshot)})}catch(error){vvBlocked=true;vvStatus('Помилка збереження: '+error.message,true);alert('VV Electric: зміни не збережено. Експортуйте резервну копію! '+error.message);break;}
   vvRevision=Number(data.revision);vvLastSerialized=snapshot;vvStatus('Синхронізовано · версія '+vvRevision);
  }
 }catch(e){vvBlocked=true;vvStatus('Помилка мережі. Експортуйте резервну копію!',true);alert('Збереження не виконано: '+e.message)}
 finally{vvSaving=false;}
}

 vvPollBusy=true;
 try{const data=await vvWorkspace('read');if(Number(data.revision)!==vvRevision){await vvLoad();vvStatus('Оновлено з іншого пристрою · версія '+vvRevision);}}
 catch(e){vvStatus('Немає зв’язку з базою: '+e.message,true)}finally{vvPollBusy=false;}
}

async function cloudBoot(){

 vvClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){vvStopPresence();vvUser=null;vvRole=null;vvReady=false;vvLock(true);return;}if(session?.user&&(!vvUser||vvUser.id!==session.user.id)){vvUser=session.user;vvLoad().catch(e=>{vvLock(true);vvEl('vv-auth-msg').textContent='Помилка бази: '+e.message;});}});

 setInterval(vvPoll,5000);
}

// VV Electric UI release 72. Fetch the deployed page bypassing HTTP cache before reload.
async function vvAppUpdate(){
 const btn=document.getElementById('vv-app-update');
 if(!navigator.onLine){alert('Для оновлення потрібен інтернет.');return;}
 if((typeof vvDirty!=='undefined'&&vvDirty)||(typeof vvSaving!=='undefined'&&vvSaving)||(typeof vvBlocked!=='undefined'&&vvBlocked)){
  alert('Є незбережені зміни або триває збереження.');return;
 }
 btn.disabled=true;btn.textContent='Перевіряю…';
 try{
  const registration=('serviceWorker' in navigator)?await navigator.serviceWorker.getRegistration():null;
  const response=await fetch(new URL('./index.html?vv_check='+Date.now(),location.href),{cache:'no-store',redirect:'follow'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const html=await response.text();
  const match=html.match(/VV Electric UI release (\d+)/);
  const deployed=match?Number(match[1]):null;
  if(!deployed)throw new Error('Не вдалося визначити версію на сервері.');
  if(deployed<=72){
   btn.textContent='✓ Актуальна';
   setTimeout(()=>{btn.textContent='↻ Оновити';btn.disabled=false},2000);
   return;
  }
  if(confirm('Доступна VV Electric '+deployed+'. Оновити зараз?')){
   if(registration)await registration.update().catch(e=>console.warn('SW update',e));
   if('caches' in window){
    const keys=await caches.keys();
    await Promise.all(keys.filter(k=>k.startsWith('vv-electric-static-')).map(k=>caches.delete(k)));
   }
   location.replace('./index.html?vv_reload='+Date.now());
   return;
  }
 }catch(e){alert('Не вдалося перевірити оновлення: '+e.message)}
 btn.textContent='↻ Оновити';btn.disabled=false;
}
</script>

<script>
function vvDialog(message,kind='alert',initial=''){
 return new Promise(resolve=>{
  const old=document.getElementById('vv-dialog-layer');if(old)old.remove();
  const layer=document.createElement('div');layer.id='vv-dialog-layer';
  const box=document.createElement('div');box.id='vv-dialog-box';
  const title=document.createElement('h3');title.textContent=kind==='confirm'?'Підтвердження':kind==='prompt'?'Введення даних':'VV Electric';
  const p=document.createElement('p');p.textContent=String(message);
  box.append(title,p);
  let input;
  if(kind==='prompt'){input=document.createElement('input');input.value=String(initial??'');box.append(input);}
  const actions=document.createElement('div');actions.className='vv-dialog-actions';
  function close(v){layer.remove();resolve(v);}
  if(kind!=='alert'){const cancel=document.createElement('button');cancel.textContent='Скасувати';cancel.onclick=()=>close(kind==='prompt'?null:false);actions.append(cancel);}
  const ok=document.createElement('button');ok.className='vv-dialog-primary';ok.textContent=kind==='alert'?'Зрозуміло':'Підтвердити';ok.onclick=()=>close(kind==='prompt'?input.value:true);actions.append(ok);
  box.append(actions);layer.append(box);document.body.append(layer);
  if(input){input.focus();input.addEventListener('keydown',e=>{if(e.key==='Enter')close(input.value);});}else ok.focus();
  layer.addEventListener('keydown',e=>{if(e.key==='Escape')close(kind==='prompt'?null:false)});
 });
}
function vvAlert(message){vvDialog(message,'alert');}
function vvConfirm(message){return vvDialog(message,'confirm');}
function vvPrompt(message,initial=''){return vvDialog(message,'prompt',initial);}
</script>

<script>
const VV_RELEASE=72;
let vvLastOfferedRelease=0;
async function vvCheckNewRelease(){
 if(document.hidden||!navigator.onLine)return;
 try{
  const r=await fetch('./index.html?vv_probe='+Date.now(),{cache:'no-store'});
  if(!r.ok)return;
  const html=await r.text();
  const m=html.match(/VV Electric UI release (\d+)/);
  const remote=m?Number(m[1]):0;
  if(remote<=VV_RELEASE||remote===vvLastOfferedRelease)return;
  vvLastOfferedRelease=remote;
  const banner=document.createElement('div');banner.id='vv-update-banner';
  const label=document.createElement('div');label.textContent='Доступна нова версія VV Electric '+remote+'. Натисніть «Оновити», щоб встановити її.';
  label.style.marginBottom='10px';
  const action=document.createElement('button');action.textContent='↻ Оновити';
  action.onclick=()=>{banner.remove();vvAppUpdate()};
  const dismiss=document.createElement('button');dismiss.textContent='Пізніше';dismiss.style.cssText='margin-left:8px;background:#38383a;color:#fff';
  dismiss.onclick=()=>banner.remove();
  banner.append(label,action,dismiss);document.getElementById('vv-update-banner')?.remove();document.body.append(banner);
 }catch(e){console.debug('Version probe unavailable',e)}
}
setInterval(vvCheckNewRelease,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)vvCheckNewRelease()});
setTimeout(vvCheckNewRelease,7000);
</script>
